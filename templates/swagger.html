<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ app_name }} - Swagger API 文档</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css">
    <style>
        body {
            margin: 0;
            background: #f6f8fb;
            color: #172033;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        .topbar {
            padding: 18px 28px;
            background: #111827;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }
        .topbar h1 {
            margin: 0;
            font-size: 20px;
        }
        .topbar a {
            color: #bfdbfe;
            text-decoration: none;
            margin-left: 14px;
        }
        #swagger-ui {
            max-width: 1280px;
            margin: 0 auto;
        }
        #fallback {
            max-width: 1040px;
            margin: 24px auto;
            padding: 20px;
            background: #fff;
            border: 1px solid #dbe3ef;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, .06);
        }
        code {
            background: #eef2ff;
            padding: 2px 6px;
            border-radius: 6px;
        }
        .endpoint {
            padding: 10px 0;
            border-bottom: 1px solid #edf2f7;
        }
        .method {
            display: inline-block;
            min-width: 56px;
            padding: 3px 8px;
            margin-right: 8px;
            border-radius: 6px;
            background: #2563eb;
            color: #fff;
            text-align: center;
            font-weight: 700;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <header class="topbar">
        <h1>{{ app_name }} - Swagger API 文档</h1>
        <nav>
            <a href="/submit">返回系统</a>
            <a href="/openapi.json">OpenAPI JSON</a>
        </nav>
    </header>

    <div id="swagger-ui"></div>

    <section id="fallback">
        <h2>OpenAPI 文档</h2>
        <p>
            如果 Swagger UI 未加载，通常是浏览器无法访问 CDN。
            仍可直接打开 <a href="/openapi.json"><code>/openapi.json</code></a> 查看完整接口描述。
        </p>
        <div id="endpoint-list">正在读取接口列表...</div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <script>
        async function renderFallback() {
            try {
                const spec = await fetch("/openapi.json").then((response) => response.json());
                const paths = spec.paths || {};
                const rows = [];
                Object.entries(paths).forEach(([path, methods]) => {
                    Object.entries(methods).forEach(([method, operation]) => {
                        rows.push(`
                            <div class="endpoint">
                                <span class="method">${method.toUpperCase()}</span>
                                <code>${path}</code>
                                <span>${operation.summary || ""}</span>
                            </div>
                        `);
                    });
                });
                document.getElementById("endpoint-list").innerHTML = rows.join("") || "暂无接口。";
            } catch (error) {
                document.getElementById("endpoint-list").textContent = `读取 OpenAPI 失败：${error.message}`;
            }
        }

        renderFallback();

        if (window.SwaggerUIBundle) {
            window.SwaggerUIBundle({
                url: "/openapi.json",
                dom_id: "#swagger-ui",
                deepLinking: true,
                presets: [window.SwaggerUIBundle.presets.apis],
                layout: "BaseLayout",
                onComplete: () => {
                    const fallback = document.getElementById("fallback");
                    if (fallback) fallback.style.display = "none";
                },
            });
        }
    </script>
    <script src="/static/ui-select.js?v=20260711-frontend-core-v002"></script>
</body>
</html>
