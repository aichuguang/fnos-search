# 日常部署只需修改 .env；宿主机目录和端口都支持环境变量覆盖。
x-app-common: &app-common
  image: aichuguang/fnos-search:${APP_VERSION:-latest}
  restart: unless-stopped
  init: true
  stop_grace_period: 2m
  extra_hosts:
    - "host.docker.internal:host-gateway"
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETGID
    - SETUID

x-app-environment: &app-environment
  TZ: ${TZ:-Asia/Shanghai}
  APP_ENV: production
  SECURITY_STRICT: "true"
  RCLONE_WORKER_CONTROL_TOKEN: "${RCLONE_WORKER_CONTROL_TOKEN:-}"
  FNOS_ROOT_KEY: "${FNOS_ROOT_KEY:-}"
  FNOS_RELAY_ROOT: /data/relay
  FNOS_LOCAL_TARGET_ROOT: /storage-targets
  TRANSFER_SOURCE_VISIBLE_TIMEOUT_SECONDS: "${TRANSFER_SOURCE_VISIBLE_TIMEOUT_SECONDS:-1800}"
  TRANSFER_NATIVE_WAIT_TIMEOUT_SECONDS: "${TRANSFER_NATIVE_WAIT_TIMEOUT_SECONDS:-604800}"
  TRANSFER_WAIT_TIMEOUT_SECONDS: "${TRANSFER_WAIT_TIMEOUT_SECONDS:-10800}"
  TRANSFER_CANCEL_TIMEOUT_SECONDS: "${TRANSFER_CANCEL_TIMEOUT_SECONDS:-3600}"
  TRANSFER_CACHE_WAIT_TIMEOUT_SECONDS: "${TRANSFER_CACHE_WAIT_TIMEOUT_SECONDS:-1800}"
  MOBILE_UPLOAD_UNCONFIRMED_TIMEOUT_SECONDS: "${MOBILE_UPLOAD_UNCONFIRMED_TIMEOUT_SECONDS:-600}"
  RELAY_PREFETCH_FILES: "${RELAY_PREFETCH_FILES:-1}"
  RELAY_CACHE_MAX_BYTES: "${RELAY_CACHE_MAX_BYTES:-21474836480}"
  RELAY_DISK_RESERVE_BYTES: "${RELAY_DISK_RESERVE_BYTES:-1073741824}"

services:
  fnos-media-import:
    <<: *app-common
    container_name: fnos-media-import
    depends_on:
      fnos-rclone-worker:
        # Worker 的 /livez 屏障保证共享数据库初始化完成，不阻塞后台修复业务配置。
        condition: service_healthy
    ports:
      - "${APP_PORT:-5251}:5251"
    environment:
      <<: *app-environment
      FNOS_PROCESS_ROLE: web
      RCLONE_WORKER_URL: http://fnos-rclone-worker:5251
      LOG_FILE: /app/logs/web.log
      # 内置 PanSou 仅在 COMPOSE_PROFILES=pansou 启用时随编排启动；
      # 后台"搜索与线路"保存过外部地址时以数据库配置为准。
      PANSOU_BASE_URL: http://pansou:8888
      PANSOU_USERNAME: "${PANSOU_USERNAME:-fnos-search}"
      PANSOU_PASSWORD: "${PANSOU_PASSWORD:-fnos-search}"
      # Agent MCP 接口默认关闭；只挂载在 web 角色，开启后需配合 Agent 令牌访问。
      FNOS_AGENT_ENABLED: "${FNOS_AGENT_ENABLED:-false}"
      AGENT_MAX_CONCURRENCY: "${AGENT_MAX_CONCURRENCY:-2}"
    volumes:
      - "${APP_CONFIG_HOST_PATH:-./config}:/app/config"
      - "${APP_DATA_HOST_PATH:-./data}:/app/data"
      - "${APP_LOGS_HOST_PATH:-./logs}:/app/logs"
      - "${FNOS_RELAY_HOST_PATH:-./rclone/relay}:/data/relay"

  # 可选内置 PanSou 聚合搜索（fish2018/pansou，纯 API 版）。
  # 默认不启动；在 .env 加 COMPOSE_PROFILES=pansou 后随编排启动。
  # 仅容器内网可达，不对宿主机开放端口；搜索缓存持久化在 PANSOU_CACHE_HOST_PATH。
  pansou:
    image: ${PANSOU_IMAGE:-ghcr.io/fish2018/pansou:latest}
    container_name: fnos-pansou
    profiles:
      - pansou
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PORT: "8888"
      AUTH_ENABLED: "true"
      AUTH_USERS: "${PANSOU_USERNAME:-fnos-search}:${PANSOU_PASSWORD:-fnos-search}"
      CACHE_PATH: /cache
      # 国内直连网络访问 TG 频道通常受阻，需要代理时取消注释：
      # PROXY: "socks5://host.docker.internal:7890"
    volumes:
      - "${PANSOU_CACHE_HOST_PATH:-./pansou/cache}:/cache"

  fnos-rclone-worker:
    <<: *app-common
    container_name: fnos-rclone-worker
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5251/livez', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    environment:
      <<: *app-environment
      FNOS_PROCESS_ROLE: all
      RCLONE_CONFIG_PATH: /config/rclone/rclone.conf
      RCLONE_CACHE_DIR: /cache
      LOG_FILE: /app/logs/worker.log
    volumes:
      - "${APP_CONFIG_HOST_PATH:-./config}:/app/config"
      - "${APP_DATA_HOST_PATH:-./data}:/app/data"
      - "${APP_LOGS_HOST_PATH:-./logs}:/app/logs"
      - "${RCLONE_CONFIG_HOST_PATH:-./rclone/config}:/config/rclone"
      - "${RCLONE_CACHE_HOST_PATH:-./rclone/cache}:/cache"
      - "${RCLONE_TEMP_HOST_PATH:-./rclone/temp}:/temp"
      - "${FNOS_RELAY_HOST_PATH:-./rclone/relay}:/data/relay"
      # 可选：本地目录存储目标（local folder storage target）。
      # 启用前先在 .env 中把 RCLONE_LOCAL_STORAGE_HOST_PATH 指向已挂载的目录，
      # 再取消下一行注释；容器内映射到 /storage-targets。
      # - "${RCLONE_LOCAL_STORAGE_HOST_PATH:-./rclone/local-storage}:/storage-targets"
