# 日常部署只需修改 .env；宿主机目录和端口都支持环境变量覆盖。
x-app-common: &app-common
  image: aichuguang/fnos-search:${APP_VERSION:-latest}
  restart: unless-stopped
  init: true
  stop_grace_period: 2m
  extra_hosts:
    - "host.docker.internal:host-gateway"
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETGID
    - SETUID

x-app-environment: &app-environment
  TZ: ${TZ:-Asia/Shanghai}
  APP_ENV: production
  SECURITY_STRICT: "true"
  APP_SECRET_KEY: "${APP_SECRET_KEY:-}"
  NOTIFICATION_ENCRYPTION_KEY: "${NOTIFICATION_ENCRYPTION_KEY:-}"
  RCLONE_WORKER_CONTROL_TOKEN: "${RCLONE_WORKER_CONTROL_TOKEN:-}"

services:
  fnos-media-import:
    <<: *app-common
    container_name: fnos-media-import
    depends_on:
      fnos-rclone-worker:
        condition: service_healthy
    ports:
      - "${APP_PORT:-5251}:5251"
    environment:
      <<: *app-environment
      FNOS_PROCESS_ROLE: web
      RCLONE_WORKER_URL: http://fnos-rclone-worker:5251
      LOG_FILE: /app/logs/web.log
    volumes:
      - "${APP_CONFIG_HOST_PATH:-./config}:/app/config"
      - "${APP_DATA_HOST_PATH:-./data}:/app/data"
      - "${APP_LOGS_HOST_PATH:-./logs}:/app/logs"

  fnos-rclone-worker:
    <<: *app-common
    container_name: fnos-rclone-worker
    environment:
      <<: *app-environment
      FNOS_PROCESS_ROLE: all
      RCLONE_CONFIG_PATH: /config/rclone/rclone.conf
      RCLONE_CACHE_DIR: /cache
      LOG_FILE: /app/logs/worker.log
    volumes:
      - "${APP_CONFIG_HOST_PATH:-./config}:/app/config"
      - "${APP_DATA_HOST_PATH:-./data}:/app/data"
      - "${APP_LOGS_HOST_PATH:-./logs}:/app/logs"
      - "${RCLONE_CONFIG_HOST_PATH:-./rclone/config}:/config/rclone"
      - "${RCLONE_CACHE_HOST_PATH:-./rclone/cache}:/cache"
      - "${RCLONE_TEMP_HOST_PATH:-./rclone/temp}:/temp"
