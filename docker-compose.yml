services:
  fnos-media-import:
    # 不创建 .env 也能直接启动；通常只需按需修改版本、端口或暂存目录。
    image: aichuguang/fnos-search:${APP_VERSION:-latest}
    container_name: fnos-media-import
    restart: unless-stopped
    init: true
    stop_grace_period: 2m
    depends_on:
      rclone-server:
        condition: service_healthy
    ports:
      - "${APP_PORT:-5251}:5251"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      APP_ENV: production
      SECURITY_STRICT: "true"
      # 仅兼容曾显式设置密钥的旧部署；新部署留空后会自动生成并持久化。
      APP_SECRET_KEY: "${APP_SECRET_KEY:-}"
      NOTIFICATION_ENCRYPTION_KEY: "${NOTIFICATION_ENCRYPTION_KEY:-}"
    extra_hosts:
      # Linux/NAS 容器可通过该名称访问宿主机上的 OpenList、PanSou 等服务。
      - "host.docker.internal:host-gateway"
    volumes:
      # 相对目录会自动创建；暂存视频较大时只需覆盖 RCLONE_TEMP_HOST_PATH。
      - ./config:/app/config
      - ./data:/app/data
      - ./logs:/app/logs
      - ${RCLONE_TEMP_HOST_PATH:-./rclone/temp}:/temp
      - /var/run/docker.sock:/var/run/docker.sock
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # 入口程序只在启动时修复挂载目录权限并降权，业务进程不保留 root。
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5251/health', timeout=5).read()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  rclone-server:
    image: rclone/rclone:1.70.3
    container_name: rclone-server
    restart: unless-stopped
    init: true
    stop_grace_period: 2m
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        for path in /config/rclone /cache /temp /temp/fnos-media-import; do
          mkdir -p "$${path}"
          chown -R 10001:10001 "$${path}"
          chmod -R u+rwX,g+rwX "$${path}"
        done
        touch /config/rclone/rclone.conf
        chown 10001:10001 /config/rclone/rclone.conf
        chmod 660 /config/rclone/rclone.conf
        exec tail -f /dev/null
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - CHOWN
      - FOWNER
    volumes:
      - ./rclone/config:/config/rclone
      - ${RCLONE_TEMP_HOST_PATH:-./rclone/temp}:/temp
      - ./rclone/cache:/cache
    healthcheck:
      test: ["CMD-SHELL", "rclone version >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
